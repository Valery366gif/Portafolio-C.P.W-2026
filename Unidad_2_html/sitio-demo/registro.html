<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro del sitio-demo">
    <meta name="keywords" content="registro,formulario,sitio-demo">
    <meta name="author" content="Valery shanay Mora Acevedo">
    <title>Formulario de Registro</title>
</head>
<body>
    <header>
        <!--Header: cabecera de la página y generalmente se repite en todo el sitio-->
        <h1>Codificación de Páginas Web</h1>
        <p>Sitio de demostración del módulo</p>
    </header>

  <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Articulo.html">Articulos</a></li>
                <li><a href="Horario.html">Horario</a></li>
                <li><a href="Registro.html">Registro</a></li>
            </ul>
        </nav> 

    <main>
        <h2>Formulario de matricula</h2>
        <form action="#" method="post">
            <!--FORM: Contenedor de del formulario. action: es donde se envia el formulario method: es el método de envío. post: envío de datos por el cuerpo de la solicitud -->
            <fieldset> <!--FIELDSET: Contenedor de los elementos del formulario-->
                                
            <legend>Información personal</legend><!--Legend: título del fieldset-->
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required><br><br>
            </p>

            <p>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required><br><br>
            </p>

            <button type="submit">Enviar matrícula</button>
        </form>

        <fieldset>
            <legend>Detalles de Matrícula</legend>
            <p>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" min="5" max="8"><br><br>
            </p>

            <p>
                <label for="fecha">Fecha de inicio:</label>
                <input type="date" id="fecha" name="fecha"><br><br>
            </p>

            <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="15" max="120" step="1"><br><br>
            </p>
        </fieldset>
        
        <fieldset>
            <legend>Modalidad</legend>
            <input type="radio" id="presencial" name="modalidad" value="presencial">
            <label for="presencial">Presencial</label><br>
            <input type="radio" id="virtual" name="modalidad" value="virtual">
            <label for="virtual">Virtual</label><br>
            <input type="radio" id="mixta" name="modalidad" value="mixta">
            <label for="mixta">Mixta</label><br><br>
        </fieldset>

     
            <label for="horario">Horario preferido</label><br>
            <select id="horario" name="horario">
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select><br><br>
        
    <fieldset>
            <legend>Intereses</legend>
            <label for="comentarios">Comentarios:</label><br>
            
            <!--TEXTAREA: es un cuaderno de texto multilinea. rows: cantidad de filas, cols: cantidad de columnas. placeholder: Texto que aparece en el cuadro de texto -->
            
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Escriba sus comentarios aquí..." ></textarea><br><br>
    </fieldset>

    </main>
    <footer>
      <!--Footer: Pie, créditos, contacto, derechos-->
      <p>
        © 2026 INA. Programa Desarrollo de Páginas Web. Todos los derechos
        reservados
      </p>
    </footer>
</body>
</html>
